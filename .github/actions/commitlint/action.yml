name: commitlint
description: Lint a commit range, or a single message, against config-conventional

inputs:
  from:
    description: Lint commits after this ref
    required: false
  to:
    description: Lint commits up to and including this ref
    required: false
  message:
    description: Lint this message instead of a commit range
    required: false

runs:
  using: composite
  steps:
    - name: Install commitlint
      env:
        # renovate: datasource=npm depName=@commitlint/cli
        COMMITLINT_VERSION: 21.2.4
      run: npm install --no-save @commitlint/cli@$COMMITLINT_VERSION @commitlint/config-conventional@$COMMITLINT_VERSION
      shell: bash

    - name: Lint commits
      if: inputs.message == ''
      env:
        FROM: ${{ inputs.from }}
        TO: ${{ inputs.to }}
      run: npx commitlint --extends @commitlint/config-conventional --from "$FROM" --to "$TO" --verbose
      shell: bash

    - name: Lint message
      if: inputs.message != ''
      env:
        MESSAGE: ${{ inputs.message }}
      run: printf '%s\n' "$MESSAGE" | npx commitlint --extends @commitlint/config-conventional --verbose
      shell: bash
