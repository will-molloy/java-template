name: commitlint
run-name: commitlint by @${{ github.actor }}

on:
  pull_request:
    types: [ opened, reopened, edited, synchronize ]
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'edited' }}

jobs:
  check-commits:
    if: github.event_name == 'push' || github.event_name == 'pull_request' && github.event.action != 'edited'
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/commitlint
        with:
          from: ${{ github.event.pull_request.base.sha || github.event.before }}
          to: ${{ github.event.pull_request.head.sha || github.sha }}

  # Squash merges use the PR title as the commit message
  check-pr-title:
    if: github.event_name == 'pull_request' && github.event.action != 'synchronize'
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
      - uses: ./.github/actions/commitlint
        with:
          message: ${{ github.event.pull_request.title }}
