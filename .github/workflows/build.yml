name: build
run-name: build by @${{ github.actor }}

on:
  pull_request:
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-java-gradle

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          flags: unit-tests-${{ matrix.os }}
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  integration-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-java-gradle

      - name: Integration test
        run: ./gradlew integrationTest --no-daemon

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          flags: integration-tests-${{ matrix.os }}
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  release:
    needs: [ build, integration-test ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Opens or updates the release PR, and releases it once it's merged.
      # PRs opened by GITHUB_TOKEN don't trigger CI, so close and reopen the release PR to run checks.
      - name: Release
        uses: googleapis/release-please-action@v5.0.0
